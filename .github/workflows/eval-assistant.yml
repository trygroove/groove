name: Assistant evals

# The assistant's musical capability evals (GRV-6), `bun run eval:assistant`,
# against the live model. On demand only, from the Actions tab ("Run
# workflow"): every run spends real API credit, so it never runs per push or
# on a schedule. It needs the `ANTHROPIC_API_KEY` Actions secret; the script
# says so and calls nothing when it is missing.
#
# It runs the script from the branch picked under "Use workflow from". The
# script arrives with GRV-6 (#1190); until that merges, pick its branch,
# `claude/grv-6-assistant-musical-capability-evals`, which carries this same
# file. A workflow_dispatch workflow only shows in the Actions tab once it is
# on `main`, which is why this file lands there first.
#
# The report (`report.md` and `report.json`) lands in the run's summary and as
# an artifact. The job fails only when the script does: the run stopped early
# (the key was refused) or every turn errored. Low pass rates are for reading,
# not a red run.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Case IDs, space-separated (blank runs every case)"
        required: false
        default: ""
      runs:
        description: "Runs per case"
        required: false
        default: "3"
      model:
        description: "Model (a key of ASSISTANT_MODELS in src/assistant/config.ts)"
        type: choice
        options:
          - claude-sonnet-5
          - claude-haiku-4-5
        default: claude-sonnet-5

permissions:
  contents: read

concurrency:
  group: eval-assistant-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    name: assistant evals (live model)
    runs-on: ubuntu-latest
    # 10 cases x 3 runs at 3 in flight, each turn capped at production's 540 s.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Inputs go through the environment, never into the script text.
          EVAL_CASES: ${{ inputs.cases }}
          EVAL_RUNS: ${{ inputs.runs }}
          EVAL_MODEL: ${{ inputs.model }}
        run: |
          read -r -a cases <<< "$EVAL_CASES"
          bun run eval:assistant -- "${cases[@]}" --runs "$EVAL_RUNS" --model "$EVAL_MODEL" --out tmp/assistant-evals/run
      - name: Add the report to the run summary
        if: ${{ !cancelled() && hashFiles('tmp/assistant-evals/run/report.md') != '' }}
        run: cat tmp/assistant-evals/run/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: assistant-evals-${{ github.run_id }}
          path: tmp/assistant-evals/run/
          if-no-files-found: ignore
          retention-days: 30
