name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Issues live in Linear, so there is no `issues` trigger here: an `@claude`
  # comment on a Linear card is picked up by board.yml's poll, which starts a
  # run on it. `issue_comment` is kept for comments on pull requests (GitHub
  # delivers those as issue comments too).
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Push as the PAT's user, not github-actions[bot]: GitHub holds the
          # CI, preview and conflicts runs a github-actions[bot] push starts until
          # someone approves them by hand.
          token: ${{ secrets.RESTACK_TOKEN || github.token }}
          # Full history, not a depth-1 clone. An implementation run has to
          # branch from `main`, and a task whose dependency landed on another
          # branch needs a real merge base to rebase or merge against. A
          # shallow clone has no merge base to find, and the failure surfaces
          # as a confusing git error partway through the run rather than at
          # checkout.
          fetch-depth: 0

      # Bun + null ALSA device. See the composite action for why the audio
      # device is mandatory, not convenience.
      - uses: ./.github/actions/claude-env

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          # Allow @claude on bot-authored PRs/comments too (e.g. a Claude-opened
          # PR), which the action otherwise blocks as a "non-human actor".
          allowed_bots: "*"
          # Without an explicit --allowedTools, this action does NOT grant
          # arbitrary Bash: only base tools (read-only git, file ops) run, so
          # every `bun`/`tsc`/`node` command a task needs is blocked with "This
          # command requires approval" and no way to approve it in a headless
          # run (see issue #43's 2026-07-31 comment). Enumerate the command
          # prefixes the repo's tasks actually use, keeping bare `Bash` too.
          # The action's default is to push a branch and post a "Create PR" link,
          # which nobody clicks: #817's 12-branch stack and several finished
          # fixes sat unopened that way. Open the PR as part of the run instead.
          claude_args: |
            --model opus
            --max-turns 120
            --append-system-prompt "Issues live in Linear: read a card with node .github/scripts/linear.mjs issue GRV-<n> (LINEAR_API_KEY is set) and refer to it as GRV-<n> in PR titles and bodies. When you push a branch for a card, open its pull request yourself before you finish (gh pr create, ready for review, not draft, following CLAUDE.md 'Landing work'), then confirm it exists with gh pr view. Never end with only a 'Create PR' link."
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,TodoWrite,NotebookEdit,WebFetch,WebSearch,Bash,Bash(bun:*),Bash(bunx:*),Bash(node:*),Bash(npx:*),Bash(tsc:*),Bash(git:*),Bash(gh:*),Bash(ls:*),Bash(cat:*),Bash(cp:*),Bash(mv:*),Bash(mkdir:*),Bash(rm:*),Bash(echo:*),Bash(grep:*),Bash(find:*),Bash(sed:*),Bash(chmod:*)"
        env:
          # Headless: the run ends when the agent's turn does, so nothing may wait
          # in the background (a backgrounded command or subagent is killed, and
          # an agent that ends its turn to wait for one ends the whole run).
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          # The cards live in Linear; a run that reads or moves one needs the key.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
