name: Assistant experiments

# One assistant experiment (GRV-110), `bun run assistant:experiment`, against
# the live model, offline on the eval fixtures. Started on demand only: by the
# board when the PR that adds or changes an experiment and completes its card
# merges (`board.mjs pr`, on main), or from the Actions tab ("Run workflow").
# Every run spends real API credit, so it never runs per push or on a schedule.
#
# Pick the branch the experiment's tactic is on under "Use workflow from":
# every variant runs in this one job against that commit, interleaved case by
# case. The experiment ID, the budget and the runs per case reach the script
# through the environment, never its text. The API key and the budget cap stay
# in this workflow, so whoever dispatches it never holds the key. Leave the
# budget blank to use the experiment file's own `budget` (else $25); a value
# given here wins over the file's.
#
# The verdict and the report are posted as a comment on the experiment's card
# (`LINEAR_API_KEY`), which then moves: Ready For Review on a win, Done on no
# win, Blocked when inconclusive or when this job fails. On a win it opens one PR labelled `hold`, from a new
# branch off this commit, that makes the winning tactic values (and every cut
# that kept) the defaults and commits the report as `docs/experiments/<id>.md`. It pushes and opens that PR
# with `RESTACK_TOKEN` when it is set, because GitHub starts no workflows (CI,
# the merge gate) for a PR `GITHUB_TOKEN` opens. `experiment.md` lands in the
# run summary and the whole report directory as an artifact.
#
# The job fails only when the script does: the key was refused, the account
# ran out of credit, every turn errored, or a win's PR failed to open (the
# comment still goes up and says so). "No win" is a finding.

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment ID (evals/experiments/<id>.ts)"
        required: true
      budget:
        description: "Budget in US dollars, no turn starts past it (blank for the experiment's own budget, else $25)"
        required: false
        default: ""
      runs:
        description: "Runs per train case (blank for the experiment's own)"
        required: false
        default: ""

permissions:
  # Push a win's branch and open its PR when RESTACK_TOKEN is not set.
  contents: write
  pull-requests: write

concurrency:
  group: assistant-experiments-${{ github.ref }}-${{ inputs.experiment }}
  cancel-in-progress: false

jobs:
  experiment:
    name: assistant experiment (live model)
    runs-on: ubuntu-latest
    # A heavy-set experiment is about 60 turns at 10 in flight; the full suite
    # about 300. Each turn is capped at production's 540 s.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RESTACK_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the experiment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
          # Inputs go through the environment, never into the script text.
          EXPERIMENT_ID: ${{ inputs.experiment }}
          EXPERIMENT_BUDGET: ${{ inputs.budget }}
          EXPERIMENT_RUNS: ${{ inputs.runs }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun run assistant:experiment -- --out tmp/assistant-experiments/run
      - name: Block the card on a failed run
        if: ${{ failure() }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          EXPERIMENT_ID: ${{ inputs.experiment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          file="evals/experiments/${EXPERIMENT_ID}.ts"
          card=$(grep -oE 'card: *"[A-Z]+-[0-9]+"' "$file" 2>/dev/null | grep -oE '[A-Z]+-[0-9]+' | head -1)
          [ -n "$card" ] && [ -n "$LINEAR_API_KEY" ] || exit 0
          node .github/scripts/linear.mjs comment "$card" --body "**Experiment run failed.** See $RUN_URL; re-run it from the Actions tab once the cause is fixed."
          node .github/scripts/linear.mjs state "$card" Blocked
      - name: Add the report to the run summary
        if: ${{ !cancelled() && hashFiles('tmp/assistant-experiments/run/experiment.md') != '' }}
        run: cat tmp/assistant-experiments/run/experiment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: assistant-experiment-${{ github.run_id }}
          path: tmp/assistant-experiments/run/
          if-no-files-found: ignore
          retention-days: 30
