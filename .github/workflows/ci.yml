name: CI

on:
  push:
    # `claude/**` covers the implementation branches the Alpha Milestone 0 workflow
    # pushes. The review stage runs against a pushed branch *before* a pull
    # request exists, so a `pull_request`-only trigger leaves reviewers with no
    # CI run to read at the moment they have to decide. That is not
    # hypothetical: FND-001's reviewer waived the "browser suite has never
    # executed" finding on the grounds that a green run was structurally
    # unobtainable at review time, and the browser jobs then failed on the
    # first PR run. Building CI on push makes that checkable when it matters.
    branches: [main, "claude/**"]
  pull_request:
  # The merge queue (merge.yml) tests each PR on top of main and the PRs queued
  # ahead of it before merging, so main only ever receives a green combination.
  # A failed queue run goes back to the PR's agent (ci-failure.yml).
  merge_group:
    types: [checks_requested]
  # The full browser suite (`browser-emulator`) is too heavy to run on
  # every push: a stack of ten PRs queued over a hundred browser jobs. They run
  # once a day on `main` instead, and on demand from the Actions tab. A failed
  # daily pass opens (or updates) a bug issue, so it lands on the board.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Cancel superseded runs on the same ref so pushes to an open PR don't queue
# up stale checks. `main` is excluded: the `deploy` job below must never be
# cancelled mid-flight (see that job's own `concurrency` block), and a
# workflow-level cancellation would kill `firebase deploy` between its
# rules/indexes release and its Hosting release, leaving production with
# mismatched rules and Hosting code and no failure signal (the run reports
# "cancelled", not "failed").
concurrency:
  # The event name keeps the daily browser pass out of `main`'s push group, where
  # a queued scheduled run would replace a pending deploy run.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Fast, no-external-service gate: typecheck, lint/format check, and the
  # unit + component suites. Everything else depends on this passing first.
  checks:
    name: typecheck, check, unit + component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type, lint and format check
        run: bun run check
      - name: Check the core-flow register against its specs
        # Cheap, no-dependency drift guard: every flow in docs/core-flows.md has
        # exactly one spec and vice versa. A flow nobody wrote a test for, or a
        # spec for a flow the register no longer describes, fails no other suite
        # here — a missing test is not a red test. See scripts/check-core-flows.mjs.
        run: bun run verify:core-flows
      - name: Configure a null ALSA output device
        # ubuntu-latest has no /dev/snd, so Tone.js's real (non-offline) global
        # AudioContext — created as a side effect of importing "tone" in
        # src/audio/ToneInstrument.test.ts — cannot initialize: node-web-audio-api's
        # cpal backend fails with "DeviceUnavailable" when it queries a default
        # output device and finds none. Installing the ALSA runtime library plus a
        # `null` PCM as the default output device (discards every sample, never
        # touches hardware) gives cpal a device to find, without needing a kernel
        # module (snd-dummy) or real audio hardware.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64
          cat > ~/.asoundrc <<'EOF'
          pcm.!default {
              type null
          }
          ctl.!default {
              type null
          }
          EOF
      - name: Every test file belongs to exactly one project
        run: bun run verify:test-projects
      - name: Unit and component tests
        # `test:all`, not `test`: the local `test` script leaves out the
        # `library-pipeline` project (the sample-library build tooling, which
        # is most of the suite's wall clock and changes infrequently). CI is
        # where that project must still run, so nothing merges without it.
        # `vitest.config.ts` defines the projects.
        run: bun run test:all
      # The machine-readable half of that run (`vitest.config.ts` configures the
      # `json` reporter alongside the terminal one). Uploaded on failure too —
      # that is the case it exists for: the artifact names every failing test,
      # its file, its assertion messages and its duration, so a red run can be
      # triaged from the run page instead of by scrolling the log or
      # re-reproducing it locally. `!cancelled()` rather than `always()` so a
      # superseded run does not upload a half-written report.
      - name: Upload the unit + component test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: vitest-report-unit
          path: vitest-report/unit.json
          retention-days: 7
      - name: Validate the starter sound library
        # Renders all 200 assets and runs the full manifest validation
        # (docs/sample-library.md section 9), including the collection-level
        # coverage and balance rules the unit suite cannot check against the
        # representative sample it renders. Needs no credentials or network.
        run: bun run library:validate
      - name: Audit the sound library release
        # Checks the records against the bytes that would ship: every pack
        # against its coverage claim and rights position, and the missing-file,
        # decode, loudness, tuning, loop-boundary and duplicate audits
        # (docs/sample-library.md section 13 Phase D and section 17, #78).
        run: bun run library:audit

  # The browser E2E suite, against a real (local, emulated) backend. Every
  # core flow lives here, so it runs in each PRD section 10 P0-gating browser
  # (Chrome, Edge, Firefox; #75, see tests/e2e/emulator/playwright.config.ts).
  # WebKit runs alongside them as a signal only — `continue-on-error` means a
  # WebKit-only failure is reported but never fails the pass, per the PRD's
  # supported-environment policy: "WebKit passing is not the same as Safari
  # passing," and the alpha does not gate release on it.
  browser-emulator:
    name: browser e2e against the emulator (${{ matrix.browser }})
    needs: checks
    # Daily and on demand only; see `on.schedule`.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    strategy:
      fail-fast: false
      matrix:
        # Branded Chrome stands in for Playwright's own Chromium here: same
        # engine, and the per-PR `browser-sanity` job already runs Chromium.
        browser: [chrome, msedge, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser (${{ matrix.browser }})
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser suite against the Firebase Emulator
        # `firebase` is a devDependency, and a GitHub Actions `run:` step does not
        # put node_modules/.bin on PATH, so a bare `firebase` here exits 127
        # ("command not found") before the emulator ever starts — which silently
        # skipped this whole job, and with it the only automated proof of the
        # FND-009 slice. Prefix it like every other node_modules binary in this
        # workflow (`bunx playwright`, `bun run test:emulator`).
        #
        # `functions` too, built first: the Auth emulator runs the blocking
        # `beforeSignIn` function that keeps the alpha to its allowlist (#854),
        # and CF-032 is about being refused by it.
        run: bun run functions:build && bunx firebase emulators:exec --only firestore,auth,storage,functions --project demo-solid-groove "bunx playwright test --config=tests/e2e/emulator/playwright.config.ts --project=${{ matrix.browser }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-emulator-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
      - name: List tests that only passed on a retry
        # CI retries a failed test twice, so a flaky test passes quietly. Name
        # them, so the daily report can file them (`browser-pass-report`).
        if: ${{ !cancelled() }}
        run: node scripts/list-flaky-tests.mjs playwright-results.json | tee flaky-${{ matrix.browser }}.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: flaky-emulator-${{ matrix.browser }}
          path: flaky-${{ matrix.browser }}.txt
          retention-days: 7

  # The per-push browser check: the emulator suite's `@sanity` subset (one pass
  # through each major surface, about a minute of tests) in Chromium. The full
  # suite, in every browser, runs daily (`browser-emulator`).
  browser-sanity:
    name: browser sanity (chromium)
    needs: checks
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser (chromium)
        run: bunx playwright install --with-deps chromium
      - name: Run the sanity subset against the Firebase Emulator
        # With `functions`, built first, as in `browser-emulator`: sign-in goes
        # through the real allowlist gate (#854).
        run: bun run functions:build && bunx firebase emulators:exec --only firestore,auth,storage,functions --project demo-solid-groove "bunx playwright test --config=tests/e2e/emulator/playwright.config.ts --project=chromium --grep @sanity"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-sanity
          path: playwright-report/
          retention-days: 7

  # Firebase Emulator suite: contract tests for firestore.rules against a
  # real local Firestore instance (PRD 9.9).
  emulator:
    name: firebase emulator tests
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Firebase Emulator suite
        run: bun run test:emulator
      # As in the `checks` job: the same run, in machine-readable form, kept
      # whether it passed or failed. `tests/emulator/vitest.config.ts` writes it.
      - name: Upload the emulator test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: vitest-report-emulator
          path: vitest-report/emulator.json
          retention-days: 7

  # FND-001b (PRD OPS-01): proves the production build itself, and the "no
  # secret reaches the client bundle" check, on every push and PR -- not only
  # when a deploy actually happens. This needs no Firebase project or
  # credentials: `bun run build` and the scanner both run entirely offline, so
  # this job runs unconditionally and gates merges like every other job here.
  # The `deploy` job below runs the same two steps (via `bun run deploy`'s
  # `predeploy` hook) against the real release SHA before shipping anything.
  build:
    name: production build + no-secrets-in-bundle check
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Verify no secret reaches the client bundle
        run: bun run verify:bundle
      # FND-001c (PRD OPS-03 / section 10): the error-monitoring SDK's bundle
      # cost is measured here rather than assumed acceptable. Fails if the SDK
      # ever lands in an eagerly-loaded chunk (i.e. if the dynamic import() in
      # src/telemetry.ts becomes a static one) or if its lazy chunk outgrows
      # the budget declared in the script. Needs no credentials.
      - name: Measure the error-monitoring SDK's bundle cost
        run: bun run verify:budget
      # #297: the landing page is statically generated into `index.html`, and
      # every other path is served a shell with that markup stripped out. Both
      # halves are properties of the build output, so both are checked against
      # it -- a shell that silently stopped prerendering, or a landing-only tag
      # added without `data-landing`, is a green build otherwise.
      - name: Verify the landing page is statically generated
        run: bun run verify:landing-static
      # GRV-105: the CSP (GRV-7) leaves 'unsafe-inline' out of `style-src`, so
      # a `style` attribute the browser has to parse -- in the prerendered
      # HTML, or baked into a Solid template in a chunk -- is refused at
      # runtime and the layout silently loses a rule. Checked against the
      # build output, where the compiler's folding of constant style entries
      # into templates is visible.
      - name: Verify no inline style reaches the build
        run: bun run verify:no-inline-styles

  # FND-001b (PRD OPS-01): deploys to the alpha's one hosted environment --
  # the production Firebase project -- from CI on every merge to `main`, never
  # from a developer machine. Rules and indexes deploy from this same pipeline
  # in the same command, so a failing rules/index step fails the deploy
  # instead of shipping application code its deployed rules don't match.
  #
  # Every value this job needs -- the four `vars` and two `secrets` read
  # below -- lives in the `prod` GitHub *environment*, so the job declares
  # `environment: prod` to have them injected. Without that declaration a job
  # sees only repository-scoped values, and an environment-scoped `vars`
  # lookup silently returns the empty string.
  #
  # That is also why the `if:` condition below no longer gates on
  # `vars.FIREBASE_PROJECT_ID`: GitHub evaluates a job's `if:` *before* it
  # loads the environment, so an environment-scoped variable is always empty
  # at gate time and would skip this job unconditionally. The branch check is
  # the gate now. Provisioning the project and setting these values is
  # tracked outside this repository -- see docs/testing.md "Deploy" for the
  # full secret/variable list and how to add them.
  deploy:
    name: deploy to Firebase Hosting
    # The full browser suites run daily, not per push, so only the sanity subset
    # gates a deploy; a red daily pass files a bug instead (`browser-pass-report`).
    needs: [checks, browser-sanity, emulator, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    # A second deploy landing while one is mid-flight must queue behind it,
    # never run concurrently or cancel it: `firebase deploy --only
    # hosting,firestore,storage` is not atomic across tiers, and two
    # overlapping deploys could interleave a Hosting release from one commit
    # with Firestore rules from another.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A service account JSON is CI-only credential material; it exists only
      # for the lifetime of this job's runner and is never checked in (see
      # .gitignore's "secrets" section and .env.example). firebase-tools reads
      # Application Default Credentials from GOOGLE_APPLICATION_CREDENTIALS,
      # which is how it authenticates non-interactively in CI.
      - name: Write the deploy service account credential
        run: printf '%s' "$FIREBASE_DEPLOY_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-deploy-service-account.json"
        env:
          FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      # `bun run deploy` is the one documented command (see README/docs/testing.md):
      # its `predeploy` hook builds and re-verifies the bundle, then this
      # deploys Hosting, Firestore rules/indexes, and Storage rules together,
      # so a failing rules/index step fails the deploy instead of shipping
      # application code its deployed rules don't match. `VITE_RELEASE_SHA`
      # stamps this exact commit into the client build (PRD OPS-01), and every
      # analytics and error event carries it (FND-001c).
      #
      # FND-001c (PRD OPS-03) hooks in through the three `SENTRY_*` values
      # below. They are consumed by app.config.ts's build plugin during this
      # step's `predeploy` build, which is the only point at which the deployed
      # artifacts and their source maps both exist:
      #
      #   - registers the release in Sentry under this exact commit SHA, and
      #   - uploads the source maps for it over an authenticated HTTPS channel,
      #     then deletes them from the build output so `firebase deploy` has no
      #     map to publish (firebase.json also refuses to upload `**/*.map`).
      #
      # All three are optional: with any of them unset the plugin is inactive
      # and the deploy proceeds unchanged, minus symbolication. That keeps this
      # job working before the Sentry project exists, exactly like the Firebase
      # gate above. See .env.example and docs/testing.md "Verifying analytics
      # and errors against a deployed build".
      - name: Build, verify, and deploy
        run: bun run deploy
        env:
          VITE_RELEASE_SHA: ${{ github.sha }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-deploy-service-account.json
          # The Firebase *client* config, read by src/firebaseConfig.ts. These
          # are baked into the client bundle at build time, so they must be
          # present in this step's environment -- not merely on the project.
          # Without them `initializeApp` receives `undefined` for every field
          # and the first Auth call fails at runtime with
          # `auth/invalid-api-key`, which renders the app's error boundary
          # instead of the page. That is a fully successful deploy of a broken
          # build: only the post-deploy smoke test catches it.
          #
          # Public by design -- they ship to every browser that loads the app,
          # are protected by security rules and API-key restrictions rather
          # than secrecy, and so are stored as `vars`, not `secrets`.
          # `verify:bundle` deliberately does not flag them (see
          # scripts/verify-no-secrets-in-bundle.mjs).
          #
          # Three of these are derived from `vars.FIREBASE_PROJECT_ID` rather
          # than stored separately. The project ID is the same value the deploy
          # targets, and Firebase builds the auth domain and storage bucket from
          # it by fixed convention (`<id>.firebaseapp.com`,
          # `<id>.firebasestorage.app`), so storing them again would only create
          # room for them to drift from the project actually being deployed to.
          #
          # The remaining three cannot be derived -- they are independent
          # identifiers assigned by Firebase -- so they stay as variables. Read
          # them from the console: Project settings -> your web app -> SDK setup.
          #
          # If a future environment ever needs the client to talk to a different
          # project than the deploy targets, or Firebase changes those suffixes,
          # that is the point to introduce explicit variables -- with the split
          # visible here rather than implied by a duplicate.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_PROJECT_ID }}.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_PROJECT_ID }}.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # FND-001c (PRD OPS-03): the second half of release registration. The
      # build step above created the release and attached its source maps;
      # this records that the release actually reached the hosted environment,
      # which is what makes Sentry's "first seen in" and regression detection
      # line up with real deploys instead of with build times.
      #
      # Deliberately after the deploy and before the smoke test: a deploy that
      # never shipped must not be marked as deployed, and a smoke-test failure
      # should still leave the release marked (it did ship; it is broken).
      # `sentry-cli` comes from @sentry/vite-plugin's own dependency, so there
      # is nothing extra to install. No-ops when the Sentry values are unset.
      - name: Mark the release as deployed in Sentry
        if: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        run: bunx sentry-cli releases deploys "$SENTRY_RELEASE" new --env alpha
        env:
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Install Playwright browser (chromium) for the post-deploy smoke test
        run: bunx playwright install --with-deps chromium
      # The origin visitors actually reach: the custom domain, not the
      # Firebase-issued `<project-id>.web.app` subdomain. Read from
      # `site.config.mjs` -- the same constant the prerendered landing page
      # names as its canonical URL (ADR 0008) -- rather than composed from the
      # project ID here, so moving the site to another domain stays a one-line
      # change in one file instead of a second copy that can drift.
      - name: Resolve the public origin
        id: site
        run: |
          origin=$(node --input-type=module \
            -e "import { SITE_ORIGIN } from './site.config.mjs'; process.stdout.write(SITE_ORIGIN);")
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "Smoke-testing against $origin"
      # PRD OPS-01: "a deployed build is smoke-tested against the hosted
      # environment ... and a failed smoke test is treated as a failed
      # deploy." This step runs after `firebase deploy` succeeds and before
      # the job is considered successful, so a failure here fails the
      # workflow -- there is no separate "mark the deploy failed" step needed.
      #
      # Because it targets the public origin, DNS, certificate and CDN
      # failures now fail the deploy too, not only Hosting ones. That is the
      # point: if a visitor cannot reach the site, the deploy did not succeed.
      # The `.web.app` origin keeps serving, and is still how you isolate
      # Hosting from DNS when diagnosing one.
      #
      # The signed-in test runs as the QA account testuser0 (#1055): the
      # service account key below signs a custom token for it, and it is this
      # step's env alone (see docs/runbooks/alpha-allowlist.md).
      - name: Post-deploy smoke test against the hosted URL
        run: bun run smoke:hosted
        env:
          SMOKE_URL: ${{ steps.site.outputs.origin }}
          QA_SIGN_IN_SERVICE_ACCOUNT: ${{ secrets.QA_SIGN_IN_SERVICE_ACCOUNT }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: hosted-smoke-test-report
          path: playwright-report/
          retention-days: 7

  # The daily pass reports to the board (Linear), not to a red run nobody
  # opens: a failure opens (or comments on) one bug, and tests that only
  # passed on a retry open (or comment on) one flaky-tests issue.
  browser-pass-report:
    name: report the daily browser pass
    needs: [browser-emulator]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: flaky-*
          merge-multiple: true
          path: flaky
      - name: Open or update the issues
        run: |
          linear() { node .github/scripts/linear.mjs "$@"; }
          # $1 title, $2 body for a new issue, $3 comment on an open one.
          file_issue() {
            id=$(linear list --label bug --json | jq -r --arg t "$1" '[.[] | select(.title == $t)][0].identifier // empty')
            if [ -n "$id" ]; then
              linear comment "$id" --body "$3" | jq -r .url
            else
              linear create --title "$1" --label bug --body "$2" | jq -r .url
            fi
          }
          if [ "$FAILED" = true ]; then
            file_issue "Bug: daily browser pass failed" \
              "The scheduled browser pass on \`main\` (${GITHUB_SHA::7}) failed: $RUN_URL. Each failing job's Playwright report is attached to the run as an artifact." \
              "Failed again: $RUN_URL"
          fi
          flaky=$(cat flaky/*.txt 2>/dev/null | sort -u)
          if [ -n "$flaky" ]; then
            list=$(printf '%s\n' "$flaky" | sed 's/^/- /')
            body=$(printf 'These tests failed and then passed on a retry in the daily browser pass (%s). Make each one deterministic; never skip or quarantine it.\n\n%s\n' "$RUN_URL" "$list")
            again=$(printf 'Flaky again in %s:\n\n%s\n' "$RUN_URL" "$list")
            file_issue "Bug: flaky browser tests" "$body" "$again"
          fi
